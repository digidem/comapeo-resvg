name: Leak probe (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: scripts/build.sh host
      - run: |
          for i in $(seq 1 15); do
            node --test-name-pattern='leak' test/test.js 2>&1 | grep -E 'RSS change|^ℹ fail' | tr '\n' ' '; echo
          done
